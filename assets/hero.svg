<text x="44" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a7a9b4" >Data Analyst and AI/ML Engineer with a B.Tech in Computer Science (AI &amp; ML).</text>
<text x="44" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a7a9b4" >I analyse business data, build machine-learning models, and turn them into</text>
