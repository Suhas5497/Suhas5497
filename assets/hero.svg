<rect x="300" y="51" width="330" height="1" fill="url(#rule)"/>
<text x="796" y="56" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.5" fill="#c9a96e">DATA · AI · PRODUCT</text>
